<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="320" viewBox="0 0 1000 320" role="img" aria-labelledby="title desc">
  <title id="title">FreezingSnail terminal card</title>
  <desc id="desc">A glassy aqua terminal window with the Snailware logo and a short introduction.</desc>
  <defs>
    <linearGradient id="aero" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0A6A7A"/>
      <stop offset="0.55" stop-color="#07516F"/>
      <stop offset="1" stop-color="#064957"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F2FDFF" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#F2FDFF" stop-opacity="0"/>
    </linearGradient>
    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#6DE8F5" opacity="0.03"/>
    </pattern>
  </defs>

  <rect x="1" y="1" width="998" height="318" rx="18" fill="url(#aero)" stroke="#1C7491"/>
  <rect x="1" y="40" width="998" height="279" fill="url(#gloss)" opacity="0.55"/>
  <rect x="1" y="40" width="998" height="279" fill="url(#scanlines)" opacity="0.8"/>
  <circle cx="710" cy="86" r="26" fill="#B8EDFF" opacity="0.08"/><circle cx="790" cy="210" r="44" fill="#B8EDFF" opacity="0.06"/><circle cx="920" cy="118" r="18" fill="#B8EDFF" opacity="0.1"/><circle cx="860" cy="300" r="30" fill="#B8EDFF" opacity="0.05"/><circle cx="665" cy="270" r="12" fill="#B8EDFF" opacity="0.12"/>

  <path d="M1 39h998" stroke="#1C7491"/>
  <circle cx="26" cy="20" r="5" fill="#FF6B7A"/>
  <circle cx="46" cy="20" r="5" fill="#FFE36E"/>
  <circle cx="66" cy="20" r="5" fill="#66E6A0"/>
  <text x="500" y="25" text-anchor="middle" fill="#8FCBD6" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">freezing@snail — ~/profile</text>
  <text x="820" y="25" fill="#FFE36E" font-size="10" letter-spacing="1.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">● ONLINE</text>

  <circle cx="120" cy="148" r="76" fill="#6DE8F5" opacity="0.10"/>
  <image x="56" y="84" width="128" height="128" href="data:image/png;base64," image-rendering="pixelated"/>
  <text x="120" y="238" text-anchor="middle" fill="#8FCBD6" font-size="10" letter-spacing="3" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">SNAILWARE</text>

  <text x="250" y="82" fill="#8FCBD6" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">freezing@snail:~$ <tspan fill="#66E6A0">whoami</tspan></text>
  <text x="250" y="122" fill="#F2FDFF" font-size="30" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">FreezingSnail</text>

  <text x="250" y="158" fill="#8FCBD6" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">freezing@snail:~$ <tspan fill="#66E6A0">cat about.txt</tspan></text>
  <text x="250" y="184" fill="#D6F8FF" font-size="14" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">small games. local-first tools.</text>
  <text x="250" y="206" fill="#D6F8FF" font-size="14" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">too many side quests.</text>

  <g transform="translate(250 232)"><rect width="46" height="24" rx="5" fill="#07516F" fill-opacity="0.72" stroke="#1C7491"/><text x="23" y="16" text-anchor="middle" fill="#B8EDFF" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">C++</text></g><g transform="translate(306 232)"><rect width="54" height="24" rx="5" fill="#07516F" fill-opacity="0.72" stroke="#1C7491"/><text x="27" y="16" text-anchor="middle" fill="#B8EDFF" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">Rust</text></g><g transform="translate(370 232)"><rect width="42" height="24" rx="5" fill="#07516F" fill-opacity="0.72" stroke="#1C7491"/><text x="21" y="16" text-anchor="middle" fill="#B8EDFF" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">Go</text></g>

  <rect x="250" y="274" width="7" height="14" fill="#66E6A0" opacity="0.95"/>
  <text x="265" y="285" fill="#5FA8B8" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">status: building</text>
</svg>
